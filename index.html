<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你四凤了</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f7f7f8;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  /* 中央大字 */
  h1 {
    position: relative;
    z-index: 2;
    margin: 0;
    font-size: clamp(32px, 12vw, 120px);
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #1f2328;
    user-select: none;
  }

  /* 背景文字墙 */
  .bg-grid {
    position: fixed;
    z-index: 0;
    inset: -30%;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    gap: 0.15em 0.35em;
    transform: rotate(-16deg);
    pointer-events: none;
    overflow: hidden;
  }
  .bg-grid span {
    font-size: clamp(36px, 6vw, 84px);
    font-weight: 800;
    letter-spacing: 0.05em;
    color: transparent;
    -webkit-text-stroke: 1px rgba(31, 35, 40, 0.13);
  }

  /* 两侧竖排滚动 */
  .side {
    position: fixed;
    z-index: 1;
    top: 0;
    bottom: 0;
    width: clamp(24px, 4vw, 48px);
    overflow: hidden;
    pointer-events: none;
  }
  .side--left { left: 4px; }
  .side--right { right: 4px; }
  .side span {
    display: block;
    writing-mode: vertical-rl;
    text-orientation: upright;
    white-space: nowrap;
    font-size: clamp(15px, 2.4vw, 28px);
    font-weight: 800;
    letter-spacing: 0.25em;
    animation: scrollY 26s linear infinite;
  }
  .side--right span { animation-direction: reverse; animation-duration: 32s; }
  @keyframes scrollY {
    from { transform: translateY(0); }
    to { transform: translateY(-50%); }
  }

  /* 上下跑马灯 */
  .marquee {
    position: fixed;
    z-index: 4;
    left: 0;
    right: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .marquee--top { top: 10px; }
  .marquee--bottom { bottom: 12px; }
  .track {
    display: flex;
    width: max-content;
    animation: slide 20s linear infinite;
  }
  .marquee--bottom .track {
    animation-direction: reverse;
    animation-duration: 26s;
  }
  .half {
    display: flex;
    flex: 0 0 auto;
  }
  .half span {
    padding-right: 1.6em;
    font-size: clamp(17px, 2.8vw, 32px);
    font-weight: 900;
    letter-spacing: 0.1em;
    background: linear-gradient(90deg, #ff2d55, #ff9500, #ffcc00, #34c759, #00c7ff, #5856d6, #ff2d55);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hueSlide 6s linear infinite;
  }
  @keyframes slide {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  @keyframes hueSlide {
    to { background-position: 200% 0; }
  }

  /* 散落的各种样式 */
  .scatter {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .scatter span {
    position: absolute;
    font-weight: 800;
    letter-spacing: 0.06em;
    white-space: nowrap;
    font-size: clamp(18px, 3vw, 42px);
  }
  /* 空心描边 */
  .s1 {
    top: 16%;
    left: 6%;
    font-size: clamp(30px, 5vw, 68px) !important;
    color: transparent;
    -webkit-text-stroke: 1.5px #5856d6;
    transform: rotate(-9deg);
    opacity: 0.7;
  }
  /* 模糊重影 */
  .s2 {
    top: 26%;
    right: 8%;
    color: #ff2d55;
    transform: rotate(7deg);
    filter: blur(2.5px);
    opacity: 0.55;
  }
  /* 镜像 */
  .s3 {
    bottom: 22%;
    left: 9%;
    color: #34c759;
    transform: scaleX(-1) rotate(-4deg);
    opacity: 0.8;
  }
  /* 竖排小字 */
  .s4 {
    top: 40%;
    right: 20%;
    writing-mode: vertical-rl;
    color: #ff9500;
    letter-spacing: 0.2em;
    font-size: clamp(15px, 2.2vw, 26px) !important;
    opacity: 0.85;
  }
  /* 描边 + 光晕 */
  .s5 {
    bottom: 14%;
    right: 12%;
    color: #00c7ff;
    text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(0, 199, 255, 0.35);
    transform: rotate(-3deg);
  }
  /* 倾斜虚线感 */
  .s6 {
    top: 62%;
    left: 24%;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255, 45, 85, 0.65);
    transform: rotate(14deg);
    opacity: 0.8;
  }
  /* 彩虹渐变 */
  .s7 {
    top: 12%;
    right: 26%;
    font-size: clamp(20px, 3.4vw, 46px) !important;
    background: linear-gradient(90deg, #ff2d55, #ffcc00, #34c759, #00c7ff, #5856d6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transform: rotate(5deg);
  }

  /* 弹跳画布 */
  #fx {
    position: fixed;
    z-index: 3;
    inset: 0;
    pointer-events: none;
  }

  /* 锁屏层 */
  .lock {
    position: fixed;
    z-index: 999;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  .lock.gone {
    display: none;
  }
  .card {
    width: min(92vw, 460px);
    box-sizing: border-box;
    padding: 26px 24px 22px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 18px 50px rgba(31, 35, 40, 0.16), 0 2px 0 rgba(31, 35, 40, 0.04);
    text-align: center;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 0.08em;
    background: linear-gradient(90deg, #ff2d55, #ff9500, #34c759, #00c7ff, #5856d6);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: hueSlide 5s linear infinite;
  }
  .card p {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.6;
    color: #6b7280;
  }
  .card p b {
    color: #1f2328;
  }
  .card input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    color: #1f2328;
    background: #f3f4f6;
    border: 1.5px solid #e5e7eb;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .card input:focus {
    border-color: #5856d6;
    background: #fff;
  }
  .card button {
    margin-top: 12px;
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-weight: 800;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(90deg, #ff2d55, #ff9500, #34c759, #00c7ff, #5856d6);
    background-size: 200% 100%;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    animation: hueSlide 6s linear infinite;
  }
  .card .msg {
    min-height: 20px;
    margin: 10px 0 0;
    font-size: 13px;
    color: #ff2d55;
  }
  .shake {
    animation: shake 0.36s ease-in-out;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-7px); }
    40% { transform: translateX(7px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }

  /* 入口：纯黑背景 + 一个小按钮 */
  .entry {
    position: fixed;
    z-index: 2000;
    inset: 0;
    display: grid;
    place-items: center;
    background: #000;
  }
  .entry.gone {
    display: none;
  }
  .entry__btn {
    padding: 10px 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: #fff;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.45);
    border-radius: 999px;
    cursor: pointer;
  }
  .entry__btn:hover {
    background: rgba(255, 255, 255, 0.12);
  }
  .entry__hint {
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.6);
    text-align: center;
  }
</style>
</head>
<body>
  <div class="bg-grid" id="bgGrid" aria-hidden="true"></div>

  <div class="side side--left" aria-hidden="true"><span id="vtLeft"></span></div>
  <div class="side side--right" aria-hidden="true"><span id="vtRight"></span></div>

  <div class="marquee marquee--top" aria-hidden="true"><div class="track"></div></div>
  <div class="marquee marquee--bottom" aria-hidden="true"><div class="track"></div></div>

  <h1>你四凤了</h1>

  <div class="scatter" aria-hidden="true">
    <span class="s1">你四凤了</span>
    <span class="s2">你四凤了</span>
    <span class="s3">你四凤了</span>
    <span class="s4">你四凤了</span>
    <span class="s5">你四凤了</span>
    <span class="s6">你四凤了</span>
    <span class="s7">你四凤了</span>
  </div>

  <canvas id="fx"></canvas>

  <!-- 背景音乐：四个音轨同时循环播放 -->
  <audio class="bgm" loop preload="auto" src="music/01.mp3"></audio>
  <audio class="bgm" loop preload="auto" src="music/02.mp3"></audio>
  <audio class="bgm" loop preload="auto" src="music/03.mp3"></audio>
  <audio class="bgm" loop preload="auto" src="music/04.mp3"></audio>

  <div class="lock" id="lock">
    <div class="card" id="card">
      <h2>你四凤了</h2>
      <p>在全屏里待着吧，想走？<br>在下面输入 <b>你是我爸爸</b> 才能解锁。</p>
      <form id="unlockForm" autocomplete="off">
        <input id="answer" type="text" placeholder="在这里输入那句话" autocomplete="off" spellcheck="false">
        <button type="submit">解锁</button>
      </form>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="entry" id="entry">
    <div id="entryBox">
      <button class="entry__btn" id="entryBtn" type="button">点进来打开Michael黑历史</button>
      <div class="entry__hint">建议音量调到 20 以上：进入后是一段音频解说，音量太低会听不清。</div>
    </div>
  </div>

<script>
(function () {
  var TEXT = '你四凤了';

  /* 背景文字墙 */
  var grid = document.getElementById('bgGrid');
  var wall = '';
  for (var i = 0; i < 80; i++) wall += '<span>' + TEXT + '</span>';
  grid.innerHTML = wall;

  /* 上下跑马灯：两段完全相同的内容，位移 50% 实现无缝 */
  var halves = '<div class="half">';
  for (var j = 0; j < 10; j++) halves += '<span>' + TEXT + '</span>';
  halves += '</div>';
  document.querySelectorAll('.track').forEach(function (track) {
    track.innerHTML = halves + halves;
  });

  /* 两侧竖排滚动：内容再复制一遍，位移 50% 无缝 */
  var verticalText = '';
  for (var k = 0; k < 40; k++) verticalText += TEXT + '　';
  document.getElementById('vtLeft').textContent = verticalText + verticalText;
  document.getElementById('vtRight').textContent = verticalText + verticalText;

  /* ---------- 弹跳彩色字 ---------- */
  var canvas = document.getElementById('fx');
  var ctx = canvas.getContext('2d');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var FONT = '"PingFang SC", "Microsoft YaHei", system-ui, sans-serif';

  var W = 0, H = 0;
  var items = [];
  var last = 0;

  function rand(a, b) { return a + Math.random() * (b - a); }

  function build() {
    items = [];
    var count = Math.max(8, Math.min(30, Math.round(W * H / 65000)));
    var base = Math.max(16, Math.min(64, Math.min(W, H) * 0.075));

    for (var i = 0; i < count; i++) {
      var size = rand(base * 0.45, base * 1.25);
      ctx.font = '800 ' + size + 'px ' + FONT;
      var w = ctx.measureText(TEXT).width;
      var speed = rand(40, 110);
      var dir = rand(0, Math.PI * 2);

      items.push({
        x: rand(w / 2, Math.max(w / 2 + 1, W - w / 2)),
        y: rand(size / 2, Math.max(size / 2 + 1, H - size / 2)),
        vx: Math.cos(dir) * speed,
        vy: Math.sin(dir) * speed,
        size: size,
        w: w,
        h: size,
        angle: rand(-0.18, 0.18),
        spin: rand(-0.5, 0.5),
        hue: rand(0, 360),
        hueSpeed: rand(30, 90)
      });
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    build();
  }

  function update(it, dt) {
    it.x += it.vx * dt;
    it.y += it.vy * dt;
    it.angle += it.spin * dt;
    it.hue = (it.hue + it.hueSpeed * dt) % 360;

    var c = Math.abs(Math.cos(it.angle));
    var s = Math.abs(Math.sin(it.angle));
    var hw = (it.w / 2) * c + (it.h / 2) * s;
    var hh = (it.w / 2) * s + (it.h / 2) * c;

    if (it.x - hw < 0) { it.x = hw; it.vx = Math.abs(it.vx); }
    if (it.x + hw > W) { it.x = W - hw; it.vx = -Math.abs(it.vx); }
    if (it.y - hh < 0) { it.y = hh; it.vy = Math.abs(it.vy); }
    if (it.y + hh > H) { it.y = H - hh; it.vy = -Math.abs(it.vy); }
  }

  function draw(it) {
    var g = ctx.createLinearGradient(-it.w / 2, 0, it.w / 2, 0);
    g.addColorStop(0, 'hsl(' + it.hue + ', 90%, 58%)');
    g.addColorStop(0.5, 'hsl(' + ((it.hue + 60) % 360) + ', 90%, 60%)');
    g.addColorStop(1, 'hsl(' + ((it.hue + 120) % 360) + ', 90%, 55%)');

    ctx.save();
    ctx.translate(it.x, it.y);
    ctx.rotate(it.angle);
    ctx.font = '800 ' + it.size + 'px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'hsla(' + it.hue + ', 90%, 60%, 0.5)';
    ctx.shadowBlur = 16;
    ctx.fillStyle = g;
    ctx.fillText(TEXT, 0, 0);
    ctx.restore();
  }

  function tick(now) {
    var dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;

    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < items.length; i++) {
      update(items[i], dt);
      draw(items[i]);
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(tick);

  /* ---------------- 锁屏逻辑 ---------------- */
  var ANSWER = '你是我爸爸';
  // 关闭时弹出的新网页地址
  var COPY_URL = 'https://miluo7878.github.io/harrow/';
  var locked = true;
  var tracks = Array.prototype.slice.call(document.querySelectorAll('audio.bgm'));
  var entry = document.getElementById('entry');
  var entryBtn = document.getElementById('entryBtn');
  var entered = false;
  var lock = document.getElementById('lock');
  var card = document.getElementById('card');
  var input = document.getElementById('answer');
  var msg = document.getElementById('msg');

  function normalize(s) {
    return String(s || '').replace(/\s+/g, '').replace(/,/g, '，');
  }

  // 锁定键盘：全屏时把 Esc / Ctrl+W 等按键交给网页，防止一按就退出
  function lockKeyboard() {
    if (!navigator.keyboard || !navigator.keyboard.lock) return;
    try {
      var p = navigator.keyboard.lock(['Escape', 'KeyW', 'KeyR', 'KeyT', 'KeyN']);
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  function goFullscreen() {
    if (!locked) return;
    if (document.fullscreenElement) {
      lockKeyboard();
      return;
    }
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!fn) return;
    try {
      var p = fn.call(el, { navigationUI: 'hide' });
      if (p && p.then) {
        p.then(lockKeyboard, function () {});
      } else {
        lockKeyboard();
      }
    } catch (e) {
      try {
        var p2 = fn.call(el);
        if (p2 && p2.then) p2.then(lockKeyboard, function () {});
      } catch (e2) {}
    }
  }

  // 四个音轨全部音量拉满、同时循环播放
  function playAll() {
    for (var i = 0; i < tracks.length; i++) {
      var a = tracks[i];
      try {
        a.muted = false;
        a.volume = 1;
        if (a.paused) {
          var p = a.play();
          if (p && p.catch) p.catch(function () {});
        }
      } catch (e) {}
    }
  }

  function startPlayback() {
    if (entered) playAll();
  }

  // 任何手势都同时尝试全屏和播放，失败会继续重试
  function arm() {
    if (!locked) return;
    fsTries = 0;
    goFullscreen();
    startPlayback();
  }
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach(function (evt) {
    window.addEventListener(evt, arm, { passive: true });
  });

  // 点按钮直接进入：全屏、锁键盘、开始播放
  function enter() {
    if (entered) return;
    entered = true;
    entry.classList.add('gone');
    goFullscreen();
    lockKeyboard();
    playAll();
    msg.textContent = '';
  }

  entryBtn.addEventListener('click', enter);

  // 被暂停就继续播放，保持一直响
  setInterval(function () {
    if (entered && locked) playAll();
  }, 1500);

  // 页面一打开就尝试全屏，被浏览器拒绝后定时重试
  goFullscreen();
  var fsTries = 0;
  var fsTimer = setInterval(function () {
    if (!locked) {
      clearInterval(fsTimer);
      return;
    }
    if (document.fullscreenElement) {
      fsTries = 0;
      return;
    }
    if (fsTries >= 10) {
      clearInterval(fsTimer);
      return;
    }
    fsTries++;
    goFullscreen();
  }, 1000);

  // 只要全屏被退出，立刻抢回来并提示
  document.addEventListener('fullscreenchange', function () {
    if (!locked) return;
    if (document.fullscreenElement) {
      lockKeyboard();
      msg.textContent = '';
      return;
    }
    msg.textContent = '全屏被退出了，点一下页面任意位置马上回去。';
    goFullscreen();
    setTimeout(goFullscreen, 80);
    setTimeout(goFullscreen, 500);
  });

  // 切回标签页时再抢一次全屏
  document.addEventListener('visibilitychange', function () {
    if (locked && !document.hidden) {
      goFullscreen();
      startPlayback();
    }
  });

  // 页面关闭前的确认弹窗（浏览器允许的唯一“拦一下”手段）
  function onBeforeUnload(e) {
    if (!locked) return;
    popCopies();
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
  window.addEventListener('beforeunload', onBeforeUnload);

  // 关闭的一刻再抢一次：部分浏览器在 pagehide / unload 阶段仍允许开窗
  window.addEventListener('pagehide', function () {
    if (locked) popCopies();
  });
  window.addEventListener('unload', function () {
    if (locked) popCopies();
  });

  var popMsgShown = false;

  // 开一个新窗口：window.open 被拦时改用模拟点击链接
  function openCopy() {
    var w = null;
    try {
      w = window.open(COPY_URL, '_blank');
    } catch (e) {}
    if (w) return w;
    try {
      var a = document.createElement('a');
      a.href = COPY_URL;
      a.target = '_blank';
      a.rel = 'noopener';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      a.parentNode.removeChild(a);
      return a;
    } catch (e2) {}
    return null;
  }

  // 关掉就再开两个新网页
  function popCopies() {
    var opened = 0;
    for (var i = 0; i < 2; i++) {
      if (openCopy()) opened++;
    }
    if (opened < 2 && !popMsgShown) {
      popMsgShown = true;
      msg.textContent = '浏览器拦截了新窗口：在地址栏允许本站弹出窗口后，关闭时才会真的弹出。';
    }
    return opened;
  }

  // 本页如果是被弹出来的子页面：发现父窗口被关，就自动再开两个
  if (window.opener) {
    var spawned = false;
    var openerTimer = setInterval(function () {
      var openedGone = true;
      try {
        openedGone = !window.opener || window.opener.closed;
      } catch (e) {}
      if (!openedGone) return;
      clearInterval(openerTimer);
      if (spawned || !locked) return;
      spawned = true;
      popCopies();
    }, 400);
  }

  window.addEventListener('keydown', function (e) {
    if (!locked) return;
    var key = e.key || '';

    if (e.altKey && key === 'F4') {
      e.preventDefault();
      e.stopPropagation();
      popCopies();
      return;
    }

    if (key === 'F5' || key === 'F11') {
      e.preventDefault();
      return;
    }

    if (e.ctrlKey) {
      var k = key.toLowerCase();
      if (k === 'r' || k === 'w' || k === 'n' || k === 't' || k === 'p') {
        e.preventDefault();
      }
    }
  }, true);

  function unlock() {
    locked = false;
    clearInterval(fsTimer);
    for (var i = 0; i < tracks.length; i++) {
      try { tracks[i].pause(); } catch (e) {}
    }
    if (navigator.keyboard && navigator.keyboard.unlock) {
      try { navigator.keyboard.unlock(); } catch (e) {}
    }
    window.removeEventListener('beforeunload', onBeforeUnload);
    lock.classList.add('gone');

    if (document.fullscreenElement && document.exitFullscreen) {
      try {
        var p = document.exitFullscreen();
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }

    // 尝试直接关掉窗口；如果不是脚本打开的窗口，浏览器会拒绝
    try {
      window.open('', '_self');
      window.close();
    } catch (e) {}
  }

  document.getElementById('unlockForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (normalize(input.value) === normalize(ANSWER)) {
      unlock();
      return;
    }
    msg.textContent = '不对，再想想。';
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    input.select();
  });

  input.focus();
})();
</script>
</body>
</html>
